name: Voltes Regression Check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check completion.js
          node --check strava-ocr.js
          node --check sw.js
          node --check tests/regression.cjs
      - name: Run lightweight offline regression suite
        run: node tests/regression.cjs
