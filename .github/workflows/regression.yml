name: Voltes Regression Check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check completion.js
          node --check strava-ocr.js
          node --check sw.js
          node --check tests/regression.cjs
      - name: Run lightweight offline regression suite
        run: node tests/regression.cjs
      - name: Run ride completion and member interaction suites
        run: npm test
      - name: Install pinned PostgreSQL test emulator
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test SQL migrations and database access controls
        run: npm run test:db
      - name: Test bicycle history and Admin lockout persistence
        run: node tests/longterm-db.cjs
      - name: Test full disaster-recovery bootstrap from empty database
        run: node tests/fresh-install-db.cjs
