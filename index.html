<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BikeHub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>BikeHub <small>| <span id="display-username"></span></small></h1>
        </header>

        <section id="name-modal" style="display:block;">
            <h3>Καλώς ήρθες! Πώς σε λένε;</h3>
            <input type="text" id="modal-username-input" placeholder="Όνομα...">
            <button id="save-name-btn">Αποθήκευση</button>
        </section>

        <section id="add-ride-section">
            <h3>Οργάνωση βόλτας</h3>
            <select id="ride-title-select" onchange="window.checkNewRoute()"></select>
            <select id="start-point-select" onchange="window.checkNewPoint()"></select>
            <input type="datetime-local" id="ride-date">
            <button id="add-ride-btn">Δημιουργία</button>
        </section>

        <section id="rides-section">
            <h3>Επόμενες βόλτες</h3>
            <div id="rides-container"></div>
        </section>

        <section id="chat-section">
            <h3>Chat</h3>
            <div id="chat-box" style="height:200px; overflow-y:scroll; border:1px solid #ccc; margin-bottom:10px;"></div>
            <input type="text" id="chat-text" placeholder="Γράψε ένα μήνυμα...">
            <button id="send-chat-btn">Αποστολή</button>
        </section>
    </div>
    <script type="module" src="script.js"></script>
</body>
</html>
