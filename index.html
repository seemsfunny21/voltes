<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BikeHub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="name-modal" class="modal-overlay">
        <div class="modal">
            <h2>Καλώς ήρθατε στο BikeHub</h2>
            <input type="text" id="modal-username-input" placeholder="Το όνομά σας...">
            <button id="save-name-btn">Είσοδος</button>
        </div>
    </div>

    <header>
        <h1>BikeHub</h1>
        <p>Χρήστης: <span id="display-username"></span></p>
    </header>

    <main>
        <section id="chat">
            <h2>Chat</h2>
            <div id="chat-messages"></div>
            <div class="chat-input-group">
                <input type="text" id="chat-text" placeholder="Γράψτε μήνυμα...">
                <button id="send-chat-btn">Αποστολή</button>
            </div>
        </section>

        <section id="rides">
            <h2>Προγραμματισμός Βόλτας</h2>
            <input type="text" id="ride-title" placeholder="Τίτλος βόλτας...">
            <button id="add-ride-btn">Δημιουργία</button>
        </section>
    </main>

    <script type="module" src="script.js"></script>
</body>
</html>
