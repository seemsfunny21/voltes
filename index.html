<!DOCTYPE html>
<html lang="el">
<head><meta charset="UTF-8"><title>BikeHub</title><link rel="stylesheet" href="style.css"></head>
<body>
    <div id="name-modal" class="modal-overlay">
        <div class="modal-card">
            <h2>🚴‍♂️ Καλώς ήρθατε!</h2>
            <input type="text" id="modal-username-input" placeholder="Το όνομα σας...">
            <button id="save-name-btn">Είσοδος</button>
        </div>
    </div>
    <div class="container">
        <h1>🚴‍♂️ BikeHub</h1>
        <p><span id="display-username"></span></p>
        <div class="card">
            <h2>📅 Προγραμματισμός</h2>
            <input type="text" id="ride-title" placeholder="Τίτλος...">
            <input type="datetime-local" id="ride-date">
            <button id="add-ride-btn">Δημιουργία</button>
            <div id="rides-container"></div>
        </div>
        <div class="card">
            <h2>✉️ Πρόσκληση</h2>
            <div style="display:flex; gap:10px; flex-wrap:wrap;">
                <a href="#" id="whatsapp-link" class="btn-social btn-whatsapp">WhatsApp</a>
                <a href="#" id="messenger-link" class="btn-social btn-messenger">Messenger</a>
                <a href="#" id="facebook-link" class="btn-social btn-facebook">Facebook</a>
            </div>
        </div>
    </div>
    <script type="module" src="script.js"></script>
</body>
</html>
