<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BikeHub Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="name-modal" class="modal-overlay">
        <div class="modal-card">
            <h2>🚴‍♂️ Καλώς ήρθατε στο BikeHub!</h2>
            <input type="text" id="modal-username-input" placeholder="Το όνομα σας...">
            <button id="save-name-btn">Είσοδος</button>
        </div>
    </div>
    <div class="container">
        <header class="app-header">
            <h1>🚴‍♂️ BikeHub</h1>
            <p>(<span id="display-username">Χρήστης</span>) | <span id="theme-toggle" onclick="toggleTheme()">Dark Mode 🌗</span></p>
        </header>
        <div class="card">
            <h2>💬 Συζήτηση</h2>
            <div id="chat-box"></div>
            <div class="chat-input-group">
                <input type="text" id="chat-text" placeholder="Μήνυμα...">
                <button id="send-chat-btn">Αποστολή</button>
            </div>
        </div>
        <div class="card">
            <h2>📅 Πρόγραμμα</h2>
            <select id="ride-title-select" onchange="checkNewRoute()"></select>
            <select id="start-point-select" onchange="checkNewPoint()"></select>
            <input type="datetime-local" id="ride-date">
            <button id="add-ride-btn">Δημιουργία</button>
            <div class="rides-list" id="rides-container"></div>
        </div>
    </div>
    <script type="module" src="script.js"></script>
</body>
</html>
