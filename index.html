<!doctype html><html lang="el" data-theme="blue"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061427"><meta name="description" content="Ομαδικές βόλτες και ιστορικό ποδηλασίας στα Ιωάννινα"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg?v=2" type="image/svg+xml"><link rel="stylesheet" href="style.css?v=88"><title>Ποδηλασία στα Ιωάννινα</title><style id="app-share-install-style">
 .app-share-install{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;width:100%;margin:8px 0 2px;box-sizing:border-box}
 .app-share-install button{display:flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:8px 5px;border:1px solid #3998ff88;border-radius:10px;background:transparent;color:inherit;font:600 12px system-ui,sans-serif;cursor:pointer;line-height:1.3}
 .app-share-install button:hover{background:#3998ff22}
 .app-share-install button:focus-visible{outline:2px solid #3998ff;outline-offset:2px}
 .app-share-install button:disabled{opacity:.55;cursor:default}
 .app-share-install svg{width:17px;height:17px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
 .app-share-install-note{grid-column:1/-1;font:12px/1.5 system-ui,sans-serif;text-align:center;overflow-wrap:anywhere;opacity:.85}
 .app-share-install-note:empty{display:none}
 .app-share-install-note a{color:inherit;text-decoration:underline}
 .app-share-install-note input{width:100%;box-sizing:border-box;font:12px system-ui,sans-serif;margin:4px 0}
 </style><script id="app-share-install-script">
 (function(){
 "use strict";
 const NAME="Ποδηλασία στα Ιωάννινα",URL_="https://seemsfunny21.github.io/voltes/",ANCHOR=".voltes-push-actions";
 let installEvent=null;
 const standalone=()=>window.matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
 const frame=()=>window.self!==window.top;
 function refresh(){document.querySelectorAll(".app-share-install [data-app-action='install']").forEach(b=>{b.disabled=standalone();b.querySelector("span").textContent=standalone()?"Εγκατεστημένη":"Εγκατάσταση";});}
 window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvent=e;refresh()});
 window.addEventListener("appinstalled",()=>{installEvent=null;refresh();document.querySelectorAll(".app-share-install-note").forEach(n=>n.textContent="✓ Η εφαρμογή εγκαταστάθηκε.")});
 function makeLink(note,label){const a=document.createElement("a");a.href=URL_;a.target="_blank";a.rel="noopener noreferrer";a.textContent=label;note.append(a);}
 function copyFallback(note){note.textContent="Αντίγραψε τον σύνδεσμο και στείλ’ τον μέσω Messenger, Instagram ή Viber.";const field=document.createElement("input");field.readOnly=true;field.value=URL_;field.setAttribute("aria-label","Σύνδεσμος εφαρμογής");note.append(field);field.focus();field.select();}
 async function share(note){note.textContent="";const data={title:NAME,text:"Δες την εφαρμογή "+NAME+"!",url:URL_};if(typeof navigator.share==="function"){try{await navigator.share(data);return}catch(e){if(e.name==="AbortError")return;}}if(navigator.clipboard&&navigator.clipboard.writeText){try{await navigator.clipboard.writeText(URL_);note.textContent="✓ Ο σύνδεσμος αντιγράφηκε. Επικόλλησέ τον στο Messenger, Instagram ή Viber.";return}catch(e){}}copyFallback(note);}
 async function install(note){note.textContent="";if(standalone()){note.textContent="Η εφαρμογή είναι ήδη εγκατεστημένη σε αυτή την προβολή.";return;}if(frame()){note.textContent="Άνοιξε την εφαρμογή ξεχωριστά για εγκατάσταση: ";makeLink(note,"Άνοιγμα εφαρμογής");window.open(URL_,"_blank","noopener,noreferrer");return;}if(installEvent){const e=installEvent;installEvent=null;try{await e.prompt();const choice=await e.userChoice;if(choice.outcome==="accepted")note.textContent="✓ Επιλέχθηκε εγκατάσταση.";else note.textContent="Η εγκατάσταση ακυρώθηκε.";refresh();return}catch(err){}}if(/iPad|iPhone|iPod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1)){note.textContent="Στο Safari πάτησε Κοινοποίηση → Προσθήκη στην οθόνη αφετηρίας.";}else{note.textContent="Στον Chrome άνοιξε το μενού ⋮ → Εγκατάσταση εφαρμογής ή Προσθήκη στην αρχική οθόνη. Αν δεν υπάρχει επιλογή, άνοιξε την εφαρμογή σε υποστηριζόμενο browser.";}}
 function mount(){const anchor=document.querySelector(ANCHOR);if(!anchor)return;const parent=anchor.classList.contains("push-card")?anchor:anchor.parentElement;if(!parent||parent.querySelector(".app-share-install"))return;
 const box=document.createElement("div");box.className="app-share-install";
 box.innerHTML='<button type="button" data-app-action="share"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 10.5 6.8-4M8.6 13.5l6.8 4"/></svg><span>Αποστολή σε φίλο</span></button><button type="button" data-app-action="install"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="2" width="14" height="20" rx="3"/><path d="M12 6v9m-4-4 4 4 4-4M10 19h4"/></svg><span>Εγκατάσταση</span></button><div class="app-share-install-note" role="status" aria-live="polite"></div>';
 const note=box.querySelector(".app-share-install-note");
 box.querySelector("[data-app-action='share']").addEventListener("click",()=>void share(note));
 box.querySelector("[data-app-action='install']").addEventListener("click",()=>void install(note));
 if(parent===anchor)anchor.append(box);else anchor.after(box);
 refresh();}
 function start(){mount();new MutationObserver(mount).observe(document.body,{childList:true,subtree:true});}
 if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",start,{once:true});else start();
 
 })();
 </script></head><body><div class="shell"><header><img class="hero-scene" src="hero-cyclist.webp" width="440" height="180" alt="" decoding="async"><div class="brand"><span class="brand-icon" aria-hidden="true"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="5.5" cy="17.5" r="4"/><circle cx="18.5" cy="17.5" r="4"/><path d="M5.5 17.5 10 8h5l3.5 9.5M5.5 17.5h9L10 8M8 8h4M15 5h2l1 3"/></svg></span><span><strong>Ποδηλασία στα Ιωάννινα</strong><small>Η παρέα μας, οι διαδρομές μας</small></span></div></header><nav id="nav" class="hidden" aria-label="Μενού"><div id="adminNav" class="hidden"><p>ΔΙΑΧΕΙΡΙΣΗ</p><button data-route="new">+ Νέα βόλτα</button><button data-route="riders">Ποδηλάτες & επισκέπτες</button><button data-route="stats">Στατιστικά</button></div><button id="authBtn">Είσοδος Admin</button></nav><main id="app" aria-live="polite"></main></div><div class="bottom-nav" id="bottomNav" aria-label="Κάτω πλοήγηση"><button type="button" data-bottom-route="home" class="active"><span aria-hidden="true">⌂</span>Αρχική</button><button type="button" data-bottom-route="members"><span aria-hidden="true">♟</span>Προφίλ</button><button type="button" data-bottom-route="activityGame"><span aria-hidden="true">🛍</span>Κατάστημα</button><button type="button" data-bottom-route="sportGame"><span aria-hidden="true">🏃</span>Άθληση</button><button type="button" data-bottom-route="menu" aria-expanded="false"><span aria-hidden="true">☰</span>Περισσότερα</button></div><script src="config.js" defer></script><script src="completion.js" defer></script><script src="strava-ocr.js?v=40" defer></script><script src="voltes-push.js?v=5" defer></script><script src="app.js?v=86" defer></script></body></html>
